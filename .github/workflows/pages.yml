name: Publish website
on:
  push:
    branches: [main]
    paths: ["docs/**", "release.txt"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v5
      - name: Stamp version
        run: |
          V=$(cat release.txt | tr -d '[:space:]')
          sed -i "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$V\"/" docs/app/index.html
          echo "{\"version\":\"$V\"}" > docs/app/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: docs }
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
