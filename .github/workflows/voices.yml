name: Record voices
on:
  push:
    branches: [main]
    paths: ["docs/app/stories.js", "tools/**", "release.txt", ".github/workflows/voices.yml"]
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: voices, cancel-in-progress: false }
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy: { fail-fast: false, matrix: { lang: [en, hi, te] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.5.1\ntorchaudio==2.5.1\nsentencepiece==0.2.0\n' > /tmp/pin.txt
          pip install -q -c /tmp/pin.txt git+https://github.com/huggingface/parler-tts.git soundfile
          pip install -q -c /tmp/pin.txt sentencepiece==0.2.0
          python -c "import torchaudio, parler_tts; print('voice tools ready')"
      - name: Record
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python tools/voices.py ${{ matrix.lang }}
      - uses: actions/upload-artifact@v4
        with: { name: "audio-${{ matrix.lang }}", path: "docs/app/audio/${{ matrix.lang }}" }
  save:
    needs: record
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Commit recordings and publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for l in en hi te; do if [ -d "dl/audio-$l" ]; then rm -rf "docs/app/audio/$l"; mkdir -p docs/app/audio; cp -R "dl/audio-$l" "docs/app/audio/$l"; fi; done
          git config user.name "Katha voices"; git config user.email "actions@users.noreply.github.com"
          git add docs/app/audio
          if ! git diff --cached --quiet; then git commit -qm "Record narration"; git pull -q --rebase origin main; git push -q origin main; fi || true
          gh workflow run pages.yml
          gh workflow run release.yml
