name: Build library
on:
  push:
    branches: [main]
    paths: ["tools/library.py", ".github/workflows/library.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # refresh once a month
permissions: { contents: write, actions: write }
concurrency: { group: library, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public-domain books
        run: python3 tools/library.py
      - name: Save and publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "Katha library"; git config user.email "actions@users.noreply.github.com"
          git add docs/books
          if ! git diff --cached --quiet; then git commit -qm "Update library"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done; fi
          gh workflow run pages.yml
