<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katha — comics you can read and hear</title>
<meta name="description" content="Katha by Bubbles: illustrated comics of the Ramayana, Mahabharata, Tenali Rama, Akbar–Birbal, Panchatantra, Greek and Egyptian myths in English, Hindi and Telugu — read them or listen.">
<meta name="theme-color" content="#0c0716">
<link rel="icon" href="../icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0716;--ink2:#171027;--card:#1d1430;--paper:#fff1c9;--paper2:#f6dfa5;--text:#f7f1ff;--mute:#b6a8cf;--pink:#ff4fa3;--cyan:#38e8ff;--amber:#ffc23d;--mint:#5cffc0;--line:#ffffff1a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text);font-family:"Space Grotesk","Noto Sans Devanagari","Noto Sans Telugu",system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden;background:radial-gradient(900px 600px at 90% -10%,#ff4fa333,transparent 60%),radial-gradient(700px 500px at -10% 30%,#38e8ff22,transparent 60%),var(--ink)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lang-hi{font-family:"Noto Sans Devanagari","Space Grotesk",sans-serif}.lang-te{font-family:"Noto Sans Telugu","Space Grotesk",sans-serif}
/* top bar */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0c0716cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:Bungee,sans-serif;font-size:22px;letter-spacing:.04em;background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff4fa366)}
.by{font-size:10px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-top:-2px}
.sp{flex:1}
.langs{display:flex;background:#ffffff10;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);transition:.25s}
.langs button.on{background:linear-gradient(90deg,var(--pink),#b34bff);color:#fff;box-shadow:0 0 16px #ff4fa388}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:#ffffff0a}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 120px}
/* hero */
.hero{margin:18px 0 8px;border-radius:26px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:300px;border:2px solid #fff1c933;box-shadow:0 30px 80px #0008,0 0 0 1px #ff4fa322,inset 0 0 60px #ff4fa311;background:linear-gradient(135deg,#2a1442,#120b22)}
.hero .art{position:relative}
.hero .art .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.stamp{align-self:flex-start;font-family:Bungee;font-size:11px;letter-spacing:.1em;color:var(--ink);background:var(--amber);padding:4px 10px;border-radius:6px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--pink)}
.hero h1{font-family:Bungee;font-size:clamp(26px,4vw,44px);line-height:1.05;text-shadow:3px 3px 0 #ff4fa3,6px 6px 0 #38e8ff55}
.hero p{color:var(--mute);font-size:15px;max-width:440px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#ffffff0d;transition:.2s}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.pri{background:linear-gradient(90deg,var(--pink),#b34bff);border:0;color:#fff;box-shadow:0 10px 30px #ff4fa355}
.btn:hover{transform:translateY(-2px)}
/* search + chips */
.search{display:none;margin:14px 0 0;position:relative}
.search.open{display:block}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--text);font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #38e8ff22}
.search svg{position:absolute;left:15px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;font-size:13px;font-weight:600;color:var(--mute);transition:.2s;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--paper);border-color:var(--paper);box-shadow:3px 3px 0 var(--pink)}
h2.sec{font-family:Bungee;font-size:18px;letter-spacing:.03em;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--pink),transparent)}
/* grid of comics */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.cover{position:relative;border-radius:16px;overflow:hidden;background:var(--paper);padding:7px;box-shadow:0 14px 30px #0007;transform:rotate(var(--r,0deg));transition:.35s cubic-bezier(.2,.8,.2,1);cursor:pointer;animation:rise .6s both}
.cover:hover{transform:rotate(0) translateY(-6px) scale(1.02);box-shadow:0 24px 50px #000a,0 0 0 2px var(--pink),0 0 40px #ff4fa355}
@keyframes rise{from{opacity:0;transform:translateY(20px) rotate(var(--r,0deg))}}
.cover .pic{aspect-ratio:1/1.15;border:2.5px solid var(--ink);border-radius:9px;overflow:hidden;position:relative;background:#000}
.cover .pic .scene{width:100%;height:100%}
.cover .badge{position:absolute;top:8px;left:8px;font-family:Bungee;font-size:9px;letter-spacing:.08em;background:var(--amber);color:var(--ink);padding:3px 7px;border-radius:5px;box-shadow:2px 2px 0 var(--ink)}
.cover .fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0c0716aa}
.cover .fav svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.cover .fav.on svg{fill:var(--pink);stroke:var(--pink)}
.cover .ttl{color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;padding:9px 4px 3px}
.cover .meta{color:#6a4b2a;font-size:11.5px;padding:0 4px 4px;display:flex;justify-content:space-between}
.empty{color:var(--mute);text-align:center;padding:50px 0}
/* reader */
.reader{position:fixed;inset:0;z-index:50;background:#07040ef2;backdrop-filter:blur(16px);display:none;flex-direction:column}
.reader.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.rbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.rbar .t{font-family:Bungee;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px;min-height:0}
.panel{width:min(92vw,62vh,640px);background:var(--paper);padding:9px;border-radius:14px;box-shadow:0 30px 80px #000,0 0 0 2px #ffffff22,0 0 60px #ff4fa333;position:relative}
.panel.turn{animation:turn .55s cubic-bezier(.2,.8,.2,1)}
.panel.back{animation:turnb .55s cubic-bezier(.2,.8,.2,1)}
@keyframes turn{from{transform:perspective(1200px) rotateY(-35deg) translateX(40px);opacity:0}}
@keyframes turnb{from{transform:perspective(1200px) rotateY(35deg) translateX(-40px);opacity:0}}
.panel .pic{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:8px;overflow:hidden;position:relative}
.panel .pic .scene{width:100%;height:100%}
.num{position:absolute;top:16px;left:16px;font-family:Bungee;font-size:12px;background:var(--pink);color:#fff;padding:3px 8px;border-radius:6px;box-shadow:2px 2px 0 var(--ink);z-index:2}
.cap{margin-top:9px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:8px;padding:12px 14px;color:var(--ink);font-size:clamp(15px,2.2vw,18px);line-height:1.55;font-weight:500;min-height:84px;position:relative}
.cap::before{content:"";position:absolute;inset:3px;border:1px dashed #0c071633;border-radius:5px;pointer-events:none}
.cap .w{transition:background .15s,color .15s;border-radius:4px}
.cap .w.hl{background:var(--pink);color:#fff;box-shadow:0 0 0 2px var(--pink)}
.cap.speaking{box-shadow:0 0 0 3px var(--cyan),0 0 30px #38e8ff88}
.ctrls{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.cb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff26;background:#ffffff0d;transition:.2s}
.cb svg{width:20px;height:20px;fill:currentColor}
.cb.play{width:66px;height:66px;background:linear-gradient(135deg,var(--pink),#b34bff);border:0;box-shadow:0 0 30px #ff4fa388}
.cb.play svg{width:26px;height:26px}
.cb.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px #38e8ff55}
.cb:disabled{opacity:.3}
.speed{font-weight:700;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.dots i{width:8px;height:8px;border-radius:9px;background:#ffffff33;transition:.3s}
.dots i.on{width:24px;background:var(--amber)}
.strip{display:none;overflow-y:auto;flex:1;padding:8px 16px 40px}
.strip .panel{margin:0 auto 18px}
.reader.stripmode .stage,.reader.stripmode .ctrls,.reader.stripmode .dots{display:none}
.reader.stripmode .strip{display:block}
.end{text-align:center;padding:14px}
.end b{font-family:Bungee;font-size:24px;color:var(--amber);text-shadow:3px 3px 0 var(--pink)}
/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#0009}
.sheet.open{display:flex}
.sheet .box{width:min(560px,100%);background:var(--ink2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:Bungee;font-size:18px;margin-bottom:12px}
.sheet .it{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.sheet .it small{color:var(--mute);display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:80;background:var(--paper);color:var(--ink);font-weight:600;padding:12px 16px;border-radius:14px;box-shadow:4px 4px 0 var(--pink),0 20px 40px #000a;transition:.35s;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.show{transform:translateX(-50%)}
.toast button{background:var(--ink);color:#fff;padding:7px 12px;border-radius:9px;font-weight:700}
/* art animation */
.scene .pop{animation:pop .7s both}
.scene .pop:nth-child(2){animation-delay:.05s}.scene .pop:nth-child(3){animation-delay:.12s}.scene .pop:nth-child(4){animation-delay:.19s}.scene .pop:nth-child(5){animation-delay:.26s}.scene .pop:nth-child(6){animation-delay:.33s}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.scene .spin{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scene .tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.scene .flick{animation:fl 1.2s ease-in-out infinite}@keyframes fl{50%{transform:scaleY(1.12) scaleX(.94)}}
.scene .wave{animation:wv 3s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-3px)}}
@media(max-width:720px){.hero{grid-template-columns:1fr}.hero .art{height:220px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.langs button{padding:6px 9px}.logo{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><div class="logo">KATHA</div><div class="by">by Bubbles</div></div>
  <span class="sp"></span>
  <div class="langs" id="langs"><button data-l="en">EN</button><button data-l="hi" class="lang-hi">हिं</button><button data-l="te" class="lang-te">తె</button></div>

</header>
<main>
  <div class="search" id="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></div>
  <section class="hero" id="hero"></section>
  <div class="chips" id="chips"></div>
  <div id="lists"></div>
</main>

<div class="reader" id="reader">
  <div class="rbar">
    <button class="ib" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t" id="rt"></div>
    <div class="langs" id="rlangs"><button data-l="en">EN</button><button data-l="hi" class="lang-hi">हिं</button><button data-l="te" class="lang-te">తె</button></div>
    <button class="ib" id="mode" aria-label="Strip view"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="1"/><rect x="4" y="14" width="16" height="7" rx="1"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="dots" id="dots"></div>
  <div class="ctrls">
    <button class="cb speed" id="speed">1×</button>
    <button class="cb" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5L7 12l8 7z"/></svg></button>
    <button class="cb play" id="play" aria-label="Listen"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="cb" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
    <button class="cb" id="auto" aria-label="Auto-play"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3V4h2v6h-6V8h2.9A6 6 0 1 0 18 12h2a8 8 0 0 1-16 0z"/></svg></button>
  </div>
  <div class="strip" id="strip"></div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script src="stories.js"></script>
<script src="art.js"></script>
<script>

  te: { all: "అన్నీ", favs: "ఇష్టమైనవి", cont: "చదవడం కొనసాగించండి", read: "చదవండి", listen: "వినండి", panels: "చిత్రాలు", search: "ఏ భాషలోనైనా కథలు వెతకండి…", none: "ఏ కథా దొరకలేదు.", feat: "ప్రత్యేకం", end: "సమాప్తం", again: "మళ్లీ చదవండి", more: "మరిన్ని కథలు", settings: "సెట్టింగ్‌లు", version: "వెర్షన్", check: "అప్‌డేట్‌ల కోసం చూడండి", latest: "మీ దగ్గర తాజా వెర్షన్ ఉంది.", newv: "కొత్త వెర్షన్ సిద్ధంగా ఉంది", update: "అప్‌డేట్ చేయండి", voice: "వాయిస్", novoice: "ఈ పరికరంలో ఈ భాషకు వాయిస్ లేదు. టెక్స్ట్-టు-స్పీచ్ సెట్టింగ్‌లలో జోడించండి, లేదా Katha Android యాప్ వాడండి.", hero: "ఇతిహాసాలు, పురాణాలు, జానపద కథలు — తెలుగు, హిందీ, ఇంగ్లీష్‌లో చదవగలిగే, వినగలిగే కామిక్స్‌గా.", lib: "గ్రంథాలయం", about: "Bubbles రూపొందించింది. ఇతిహాసాలు, జానపద కథలు, పురాణాలను కొత్త బొమ్మలతో తిరిగి చెప్పిన కామిక్స్." },
};
const LI = { en: 1, hi: 2, te: 3 };
let lang = store.get("lang", (navigator.language || "en").startsWith("te") ? "te" : (navigator.language || "").startsWith("hi") ? "hi" : "en");
let cat = "all", query = "", favs = new Set(store.get("favs", [])), progress = store.get("progress", {});
const T = k => UI[lang][k];

function setLang(l) {
  lang = l; store.set("lang", l);
  document.documentElement.lang = l; document.body.className = "lang-" + l;
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  $("#q").placeholder = T("search");
  render(); if (cur) { stopSpeech(); showPanel(idx, 0); buildStrip(); $("#rt").textContent = cur.t[lang]; }
}

// ---------- library ----------
function matches(s) {
  if (cat === "favs" && !favs.has(s.id)) return false;
  if (cat !== "all" && cat !== "favs" && s.cat !== cat) return false;
  if (!query) return true;
  const hay = (Object.values(s.t).join(" ") + " " + s.era + " " + Object.values(CATS[s.cat]).join(" ") + " " + s.p.map(p => p.slice(1).join(" ")).join(" ")).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function coverHTML(s, i) {
  const r = ((i * 37) % 5 - 2) * .6;
  return `<article class="cover" style="--r:${r}deg;animation-delay:${i * .04}s" data-id="${s.id}">
  <div class="pic">${renderScene(s.p[0][0])}<span class="badge">${s.era}</span>
  <button class="fav ${favs.has(s.id) ? "on" : ""}" data-fav="${s.id}" aria-label="Favourite"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg></button></div>
  <div class="ttl">${s.t[lang]}</div><div class="meta"><span>${CATS[s.cat][lang]}</span><span>${s.p.length} ${T("panels")}</span></div></article>`;
}
function render() {
  const chips = [["all", T("all")], ...Object.keys(CATS).map(k => [k, CATS[k][lang]]), ["favs", T("favs")]];
  $("#chips").innerHTML = chips.map(([k, n]) => `<button class="chip ${k === cat ? "on" : ""}" data-cat="${k}">${n}</button>`).join("");
  const list = STORIES.filter(matches);
  let html = "";
  const lastId = store.get("last", null), last = STORIES.find(s => s.id === lastId);
  if (!query && cat === "all" && last && progress[last.id] < last.p.length - 1) html += `<h2 class="sec">${T("cont")}</h2><div class="grid">${coverHTML(last, 0)}</div>`;
  if (!list.length) html += `<p class="empty">${T("none")}</p>`;
  else if (cat === "all" && !query) for (const k of Object.keys(CATS)) { const l = list.filter(s => s.cat === k); if (l.length) html += `<h2 class="sec">${CATS[k][lang]}</h2><div class="grid">${l.map(coverHTML).join("")}</div>`; }
  else html += `<h2 class="sec">${cat === "favs" ? T("favs") : cat === "all" ? T("lib") : CATS[cat][lang]}</h2><div class="grid">${list.map(coverHTML).join("")}</div>`;
  $("#lists").innerHTML = html;
  const f = STORIES[Math.floor(Date.now() / 864e5) % STORIES.length];
  $("#hero").innerHTML = `<div class="art">${renderScene(f.p[0][0])}</div><div class="txt"><span class="stamp">${T("feat")}</span><h1>${f.t[lang]}</h1><p>${T("hero")}</p>
  <div class="row"><button class="btn pri" data-open="${f.id}" data-listen="1"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>${T("listen")}</button><button class="btn" data-open="${f.id}">${T("read")}</button></div></div>`;
}
document.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) { e.stopPropagation(); const id = fav.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); store.set("favs", [...favs]); fav.classList.toggle("on"); if (cat === "favs") render(); return; }
  const c = e.target.closest("[data-cat]"); if (c) { cat = c.dataset.cat; render(); return; }
  const o = e.target.closest("[data-open]"); if (o) { openStory(o.dataset.open, !!o.dataset.listen); return; }
  const cv = e.target.closest(".cover"); if (cv) openStory(cv.dataset.id);
  const l = e.target.closest(".langs button"); if (l) setLang(l.dataset.l);
});
$("#sBtn").onclick = () => { $("#search").classList.toggle("open"); if ($("#search").classList.contains("open")) $("#q").focus(); };
$("#q").oninput = e => { query = e.target.value.trim(); render(); };

// ---------- reader ----------
let cur = null, idx = 0, playing = false, autoAdv = store.get("auto", true), rate = store.get("rate", 1);
function openStory(id, listen) {
  cur = STORIES.find(s => s.id === id); if (!cur) return;
  idx = progress[id] && progress[id] < cur.p.length - 1 ? progress[id] : 0;
  store.set("last", id);
  $("#rt").textContent = cur.t[lang];
  $("#reader").classList.add("open"); document.body.style.overflow = "hidden";
  $("#dots").innerHTML = cur.p.map(() => "<i></i>").join("");
  showPanel(idx, 0); buildStrip();
  history.pushState({ r: 1 }, "");
  if (listen) setTimeout(() => togglePlay(true), 400);
}
function closeReader() { stopSpeech(); $("#reader").classList.remove("open"); document.body.style.overflow = ""; cur = null; render(); }
function capHTML(text) { return text.split(/(\s+)/).map((w, i) => /\s/.test(w) ? w : `<span class="w">${w}</span>`).join(""); }
function panelHTML(i) { const p = cur.p[i]; return `<div class="pic"><span class="num">${i + 1}/${cur.p.length}</span>${renderScene(p[0])}</div><div class="cap lang-${lang}">${capHTML(p[LI[lang]])}</div>`; }
function showPanel(i, dir) {
  idx = Math.max(0, Math.min(cur.p.length - 1, i));
  progress[cur.id] = idx; store.set("progress", progress);
  const last = idx === cur.p.length - 1;
  $("#stage").innerHTML = `<div class="panel ${dir > 0 ? "turn" : dir < 0 ? "back" : ""}">${panelHTML(idx)}${last ? `<div class="end"><b>${T("end")}</b></div>` : ""}</div>`;
  document.querySelectorAll("#dots i").forEach((d, k) => d.classList.toggle("on", k === idx));
  $("#prev").disabled = idx === 0; $("#next").disabled = last;
}
function buildStrip() { if (!cur) return; $("#strip").innerHTML = cur.p.map((_, i) => `<div class="panel">${panelHTML(i)}</div>`).join("") + `<div class="end"><b>${T("end")}</b></div>`; }
$("#close").onclick = () => history.back();
window.onpopstate = () => { if (cur) closeReader(); };
$("#prev").onclick = () => { stopSpeech(); showPanel(idx - 1, -1); };
$("#next").onclick = () => { stopSpeech(); showPanel(idx + 1, 1); };
$("#mode").onclick = () => { stopSpeech(); $("#reader").classList.toggle("stripmode"); };
$("#auto").onclick = () => { autoAdv = !autoAdv; store.set("auto", autoAdv); $("#auto").classList.toggle("on", autoAdv); toast(autoAdv ? "Auto-play on" : "Auto-play off"); };
$("#auto").classList.toggle("on", autoAdv);
const RATES = [.8, 1, 1.2, 1.4];
$("#speed").textContent = rate + "×";
$("#speed").onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; store.set("rate", rate); $("#speed").textContent = rate + "×"; };
$("#play").onclick = () => togglePlay();
let sx = 0; $("#stage").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("#stage").addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 50) (d < 0 ? $("#next") : $("#prev")).click(); });
document.addEventListener("keydown", e => { if (!cur) return; if (e.key === "ArrowRight") $("#next").click(); if (e.key === "ArrowLeft") $("#prev").click(); if (e.key === " ") { e.preventDefault(); togglePlay(); } if (e.key === "Escape") history.back(); });

// ---------- narration ----------
const VOICE_LANG = { en: ["en-IN", "en-GB", "en"], hi: ["hi-IN", "hi"], te: ["te-IN", "te"] };
let voices = [], AUDIO = {}, player = null;
for (const l of ["en", "hi", "te"]) fetch(`audio/${l}/index.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => AUDIO[l] = j).catch(() => {});
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch { voices = []; } }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(l) { for (const code of VOICE_LANG[l]) { const v = voices.find(v => v.lang.replace("_", "-").toLowerCase().startsWith(code.toLowerCase())); if (v) return v; } return null; }
function setPlayIcon() { $("#playIco").innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>'; }
function togglePlay(force) { playing = force === undefined ? !playing : force; setPlayIcon(); playing ? speakPanel() : stopSpeech(true); }
function stopSpeech(keepFlag) {
  if (!keepFlag) { playing = false; setPlayIcon(); }
  if (player) { player.onended = null; player.pause(); player = null; }
  try { window.KathaAndroid ? KathaAndroid.stop() : speechSynthesis.cancel(); } catch {}
  document.querySelectorAll(".cap").forEach(c => c.classList.remove("speaking"));
}
function afterPanel() {
  if (!playing) return;
  if (autoAdv && idx < cur.p.length - 1) { showPanel(idx + 1, 1); setTimeout(speakPanel, 700); }
  else { playing = false; setPlayIcon(); document.querySelectorAll(".cap").forEach(c => c.classList.remove("speaking")); }
}
window.__ttsDone = () => afterPanel();
function speakPanel() {
  if (!cur) return;
  const text = cur.p[idx][LI[lang]], cap = $("#stage .cap"); cap && cap.classList.add("speaking");
  const words = cap ? [...cap.querySelectorAll(".w")] : [];
  // Recorded narration (natural voice) when available, the device voice otherwise.
  const key = `${cur.id}-${idx}`;
  if (AUDIO[lang] && AUDIO[lang][key]) {
    player = new Audio(`audio/${lang}/${key}.mp3?v=${AUDIO[lang][key]}`);
    player.playbackRate = rate; player.preservesPitch = true;
    player.ontimeupdate = () => { if (!player || !player.duration) return; const k = Math.floor(player.currentTime / player.duration * words.length); words.forEach((w, i) => w.classList.toggle("hl", i === k)); };
    player.onended = () => { words.forEach(w => w.classList.remove("hl")); player = null; afterPanel(); };
    player.play().catch(() => { player = null; playing = false; setPlayIcon(); });
    return;
  }
  if (window.KathaAndroid) { KathaAndroid.speak(text, lang, rate); return; }
  if (!window.speechSynthesis) { toast(T("novoice")); playing = false; setPlayIcon(); return; }
  const u = new SpeechSynthesisUtterance(text), v = pickVoice(lang);
  if (!v && lang !== "en") toast(T("novoice"));
  if (v) u.voice = v; u.lang = VOICE_LANG[lang][0]; u.rate = rate; u.pitch = 1.02;
  // highlight the word being spoken
  const starts = []; let p = 0; words.forEach(w => { starts.push(text.indexOf(w.textContent, p)); p = starts[starts.length - 1] + w.textContent.length; });
  u.onboundary = e => { let k = starts.findIndex((s, i) => e.charIndex >= s && (i === starts.length - 1 || e.charIndex < starts[i + 1])); words.forEach((w, i) => w.classList.toggle("hl", i === k)); };
  u.onend = () => { words.forEach(w => w.classList.remove("hl")); afterPanel(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

// ---------- settings & updates ----------
function toast(msg, action, fn) {
  const t = $("#toast"); t.innerHTML = `<span>${msg}</span>` + (action ? `<button>${action}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); fn(); };
  t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), action ? 12000 : 3800);
}
const newer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
async function checkUpdates(manual) {
  try {
    if (PLATFORM === "android") {
      const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { cache: "no-store" }).then(r => r.json());
      const v = (r.tag_name || "").replace(/^v/, "");
      if (v && newer(v, APP_VERSION)) {
        const apk = (r.assets || []).find(a => a.name.endsWith(".apk"));
        toast(`${T("newv")}: ${v}`, T("update"), () => KathaAndroid.openUrl(apk ? apk.browser_download_url : `https://github.com/${REPO}/releases/latest`));
      } else if (manual) toast(T("latest"));
    } else {
      const r = await fetch("version.json?" + Date.now(), { cache: "no-store" }).then(r => r.json());
      if (newer(r.version, APP_VERSION)) toast(`${T("newv")}: ${r.version}`, T("update"), async () => {
        try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch {}
        location.reload();
      });
      else if (manual) toast(T("latest"));
    }
    store.set("lastCheck", Date.now());
  } catch { if (manual) toast("Offline — try again later"); }
}
$("#setBtn").onclick = () => {
  const hasV = l => !!(window.KathaAndroid || pickVoice(l));
  $("#sheetBox").innerHTML = `<h3>${T("settings")}</h3>
  <div class="it"><span>${T("version")}<small>Katha ${APP_VERSION} · ${PLATFORM === "android" ? "Android" : "Web"}</small></span><button class="btn pri" id="chk">${T("check")}</button></div>
  <div class="it"><span>${T("voice")}<small>English ${hasV("en") ? "✓" : "—"} · हिंदी ${hasV("hi") ? "✓" : "—"} · తెలుగు ${hasV("te") ? "✓" : "—"}</small></span></div>
  ${PLATFORM === "web" ? `<div class="it"><span>Android<small>Get the Katha app</small></span><a class="btn" href="https://github.com/${REPO}/releases/latest/download/Katha.apk">APK</a></div>` : ""}
  <div class="it" style="border:0"><span><small>${T("about")}</small></span></div>`;
  $("#sheet").classList.add("open");
  $("#chk").onclick = () => checkUpdates(true);
};
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); };

setLang(lang);
if (Date.now() - store.get("lastCheck", 0) > 6 * 3600e3) setTimeout(() => checkUpdates(false), 2500);
if ("serviceWorker" in navigator && PLATFORM === "web") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
