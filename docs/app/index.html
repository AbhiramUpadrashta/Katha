<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katha — comics and books to read</title>
<meta name="description" content="Katha by Bubbles: illustrated comics of the Ramayana, Mahabharata, Tenali Rama, Akbar–Birbal, Panchatantra, Greek and Egyptian myths in English, Hindi and Telugu — read them or listen.">
<meta name="theme-color" content="#0c0716">
<link rel="icon" href="../icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Devanagari:wght@400;700&family=Noto+Serif+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0716;--ink2:#171027;--card:#1d1430;--paper:#fff1c9;--paper2:#f6dfa5;--text:#f7f1ff;--mute:#b6a8cf;--pink:#ff4fa3;--cyan:#38e8ff;--amber:#ffc23d;--mint:#5cffc0;--line:#ffffff1a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text);font-family:"Space Grotesk","Noto Sans Devanagari","Noto Sans Telugu",system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden;background:radial-gradient(900px 600px at 90% -10%,#ff4fa333,transparent 60%),radial-gradient(700px 500px at -10% 30%,#38e8ff22,transparent 60%),var(--ink)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lang-hi{font-family:"Noto Sans Devanagari","Space Grotesk",sans-serif}.lang-te{font-family:"Noto Sans Telugu","Space Grotesk",sans-serif}
/* top bar */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0c0716cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:Bungee,sans-serif;font-size:22px;letter-spacing:.04em;background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff4fa366)}
.by{font-size:10px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-top:-2px}
.sp{flex:1}
.langs{display:flex;background:#ffffff10;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);transition:.25s}
.langs button.on{background:linear-gradient(90deg,var(--pink),#b34bff);color:#fff;box-shadow:0 0 16px #ff4fa388}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:#ffffff0a}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 120px}
/* hero */
.hero{margin:18px 0 8px;border-radius:26px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:300px;border:2px solid #fff1c933;box-shadow:0 30px 80px #0008,0 0 0 1px #ff4fa322,inset 0 0 60px #ff4fa311;background:linear-gradient(135deg,#2a1442,#120b22)}
.hero .art{position:relative}
.hero .art .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.stamp{align-self:flex-start;font-family:Bungee;font-size:11px;letter-spacing:.1em;color:var(--ink);background:var(--amber);padding:4px 10px;border-radius:6px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--pink)}
.hero h1{font-family:Bungee;font-size:clamp(26px,4vw,44px);line-height:1.05;text-shadow:3px 3px 0 #ff4fa3,6px 6px 0 #38e8ff55}
.hero p{color:var(--mute);font-size:15px;max-width:440px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#ffffff0d;transition:.2s}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.pri{background:linear-gradient(90deg,var(--pink),#b34bff);border:0;color:#fff;box-shadow:0 10px 30px #ff4fa355}
.btn:hover{transform:translateY(-2px)}
/* search + chips */
.search{display:none;margin:14px 0 0;position:relative}
.search.open{display:block}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--text);font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #38e8ff22}
.search svg{position:absolute;left:15px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;font-size:13px;font-weight:600;color:var(--mute);transition:.2s;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--paper);border-color:var(--paper);box-shadow:3px 3px 0 var(--pink)}
h2.sec{font-family:Bungee;font-size:18px;letter-spacing:.03em;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--pink),transparent)}
/* grid of comics */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
.cover{position:relative;border-radius:16px;overflow:hidden;background:var(--paper);padding:7px;box-shadow:0 14px 30px #0007;transform:rotate(var(--r,0deg));transition:.35s cubic-bezier(.2,.8,.2,1);cursor:pointer;animation:rise .6s both}
.cover:hover{transform:rotate(0) translateY(-6px) scale(1.02);box-shadow:0 24px 50px #000a,0 0 0 2px var(--pink),0 0 40px #ff4fa355}
@keyframes rise{from{opacity:0;transform:translateY(20px) rotate(var(--r,0deg))}}
.cover .pic{aspect-ratio:1/1.15;border:2.5px solid var(--ink);border-radius:9px;overflow:hidden;position:relative;background:#000}
.cover .pic .scene{width:100%;height:100%}
.cover .badge{position:absolute;top:8px;left:8px;font-family:Bungee;font-size:9px;letter-spacing:.08em;background:var(--amber);color:var(--ink);padding:3px 7px;border-radius:5px;box-shadow:2px 2px 0 var(--ink)}
.cover .fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0c0716aa}
.cover .fav svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.cover .fav.on svg{fill:var(--pink);stroke:var(--pink)}
.cover .ttl{color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;padding:9px 4px 3px}
.cover .meta{color:#6a4b2a;font-size:11.5px;padding:0 4px 4px;display:flex;justify-content:space-between}
.empty{color:var(--mute);text-align:center;padding:50px 0}
/* reader */
.reader{position:fixed;inset:0;z-index:50;background:#07040ef2;backdrop-filter:blur(16px);display:none;flex-direction:column}
.reader.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.rbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.rbar .t{font-family:Bungee;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px;min-height:0}
.panel{width:min(92vw,62vh,640px);background:var(--paper);padding:9px;border-radius:14px;box-shadow:0 30px 80px #000,0 0 0 2px #ffffff22,0 0 60px #ff4fa333;position:relative}
.panel.turn{animation:turn .55s cubic-bezier(.2,.8,.2,1)}
.panel.back{animation:turnb .55s cubic-bezier(.2,.8,.2,1)}
@keyframes turn{from{transform:perspective(1200px) rotateY(-35deg) translateX(40px);opacity:0}}
@keyframes turnb{from{transform:perspective(1200px) rotateY(35deg) translateX(-40px);opacity:0}}
.panel .pic{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:8px;overflow:hidden;position:relative}
.panel .pic .scene{width:100%;height:100%}
.num{position:absolute;top:16px;left:16px;font-family:Bungee;font-size:12px;background:var(--pink);color:#fff;padding:3px 8px;border-radius:6px;box-shadow:2px 2px 0 var(--ink);z-index:2}
.cap{margin-top:9px;background:var(--paper2);border:2.5px solid var(--ink);border-radius:8px;padding:12px 14px;color:var(--ink);font-size:clamp(15px,2.2vw,18px);line-height:1.55;font-weight:500;min-height:84px;position:relative}
.cap::before{content:"";position:absolute;inset:3px;border:1px dashed #0c071633;border-radius:5px;pointer-events:none}
.cap .w{transition:background .15s,color .15s;border-radius:4px}
.cap .w.hl{background:var(--pink);color:#fff;box-shadow:0 0 0 2px var(--pink)}
.cap.speaking{box-shadow:0 0 0 3px var(--cyan),0 0 30px #38e8ff88}
.ctrls{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.cb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff26;background:#ffffff0d;transition:.2s}
.cb svg{width:20px;height:20px;fill:currentColor}
.cb.play{width:66px;height:66px;background:linear-gradient(135deg,var(--pink),#b34bff);border:0;box-shadow:0 0 30px #ff4fa388}
.cb.play svg{width:26px;height:26px}
.cb.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px #38e8ff55}
.cb:disabled{opacity:.3}
.speed{font-weight:700;font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.dots i{width:8px;height:8px;border-radius:9px;background:#ffffff33;transition:.3s}
.dots i.on{width:24px;background:var(--amber)}
.strip{display:none;overflow-y:auto;flex:1;padding:8px 16px 40px}
.strip .panel{margin:0 auto 18px}
.reader.stripmode .stage,.reader.stripmode .ctrls,.reader.stripmode .dots{display:none}
.reader.stripmode .strip{display:block}
.end{text-align:center;padding:14px}
.end b{font-family:Bungee;font-size:24px;color:var(--amber);text-shadow:3px 3px 0 var(--pink)}
/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:#0009}
.sheet.open{display:flex}
.sheet .box{width:min(560px,100%);background:var(--ink2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:Bungee;font-size:18px;margin-bottom:12px}
.sheet .it{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.sheet .it small{color:var(--mute);display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:80;background:var(--paper);color:var(--ink);font-weight:600;padding:12px 16px;border-radius:14px;box-shadow:4px 4px 0 var(--pink),0 20px 40px #000a;transition:.35s;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.show{transform:translateX(-50%)}
.toast button{background:var(--ink);color:#fff;padding:7px 12px;border-radius:9px;font-weight:700}
/* art animation */
.scene .pop{animation:pop .7s both}
.scene .pop:nth-child(2){animation-delay:.05s}.scene .pop:nth-child(3){animation-delay:.12s}.scene .pop:nth-child(4){animation-delay:.19s}.scene .pop:nth-child(5){animation-delay:.26s}.scene .pop:nth-child(6){animation-delay:.33s}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.scene .spin{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scene .tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.scene .flick{animation:fl 1.2s ease-in-out infinite}@keyframes fl{50%{transform:scaleY(1.12) scaleX(.94)}}
.scene .wave{animation:wv 3s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-3px)}}

/* ---------- shelf tabs ---------- */
.tabs{display:flex;gap:6px;margin:18px 0 0;background:#ffffff0a;border:1px solid var(--line);border-radius:16px;padding:5px;width:max-content}
.tabs button{padding:10px 20px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px;transition:.25s}
.tabs button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--pink)}
/* ---------- book shelf ---------- */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px;margin-top:8px}
.book{cursor:pointer;perspective:900px;animation:rise .6s both}
.book .cv{position:relative;aspect-ratio:2/3;border-radius:4px 12px 12px 4px;overflow:hidden;transform:rotateY(-14deg);transform-origin:left;transition:.45s cubic-bezier(.2,.8,.2,1);box-shadow:18px 20px 40px #000b,inset 6px 0 0 #00000055,inset 9px 0 0 #ffffff22}
.book:hover .cv{transform:rotateY(-4deg) translateY(-6px);box-shadow:24px 30px 60px #000c,0 0 40px #ff4fa344,inset 6px 0 0 #00000055}
.book .cv .scene{position:absolute;inset:0;width:100%;height:100%}
.book .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#0c0716ee 100%)}
.book .lbl{position:absolute;left:18px;right:14px;bottom:16px;z-index:2}
.book .lbl b{display:block;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif;font-size:21px;line-height:1.15;color:#fff;text-shadow:0 2px 10px #000}
.book .lbl small{color:var(--amber);font-size:12px;letter-spacing:.04em}
.book .orn{position:absolute;top:14px;left:18px;right:14px;height:2px;background:linear-gradient(90deg,var(--amber),transparent);z-index:2}
.book .meta{color:var(--mute);font-size:12.5px;margin-top:10px;display:flex;justify-content:space-between}
.book .bar{height:3px;border-radius:3px;background:#ffffff18;margin-top:6px;overflow:hidden}.book .bar i{display:block;height:100%;background:var(--amber)}
.book .cv.lib{background:linear-gradient(160deg,hsl(var(--h) 42% 30%),hsl(calc(var(--h) + 40) 48% 12%));padding:16px 14px 14px 20px;display:flex;flex-direction:column}
.book .cv.lib::before{content:"";position:absolute;inset:10px 10px 10px 16px;border:1px solid #ffffff2a;border-radius:3px 8px 8px 3px;pointer-events:none}
.cv.lib .lt{font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif;font-size:18px;font-weight:700;line-height:1.22;margin-top:26px;color:#fff;z-index:2;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cv.lib .la{color:#ffd8a0;font-size:12.5px;margin-top:auto;z-index:2;font-style:italic}
.cv.lib .lg{position:absolute;top:14px;right:14px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:#0006;padding:3px 7px;border-radius:6px}

/* ---------- library mode: a quiet bookstore, not a comic shop ---------- */
body.libmode{background:#16110d;background-image:radial-gradient(1200px 600px at 50% -10%,#3a2616 0,#16110d 60%)}
body.libmode::before,body.libmode::after{display:none}
body.libmode .hero{display:none}
body.libmode header{background:#16110dcc;border-color:#ffffff12}
body.libmode .tabs button.on{background:#f3e7d3;color:#2a1d12;box-shadow:none}
body.libmode .chip{border-color:#ffffff1c;color:#cdbda6}
body.libmode .chip.on{background:#f3e7d3;color:#2a1d12;box-shadow:none;border-color:#f3e7d3}
.libhead{margin:26px 0 6px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.libhead h1{font-family:"Noto Serif",Georgia,serif;font-size:clamp(28px,4vw,42px);font-weight:700;color:#f3e7d3}
.libhead p{color:#b8a68c;font-size:14px;margin-bottom:6px}
.shelf{margin:26px 0 8px}
.shelf h3{font-family:"Noto Serif",Georgia,serif;color:#f3e7d3;font-size:20px;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.shelf h3 small{font-family:"Space Grotesk";font-size:12px;color:#9c8a72;font-weight:500}
.row{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 22px;scroll-snap-type:x proximity;scrollbar-width:thin}
.row::after{content:"";flex:none;width:1px}
.shelf .plank{height:12px;margin-top:-14px;border-radius:3px;background:linear-gradient(#5a3b22,#3b2414);box-shadow:0 10px 18px #0008}
.bk{flex:none;width:128px;cursor:pointer;scroll-snap-align:start;transition:transform .25s}
.bk:hover{transform:translateY(-6px)}
.bk .cov{position:relative;width:128px;height:192px;border-radius:3px 6px 6px 3px;overflow:hidden;background:#2a1d12;box-shadow:6px 8px 18px #000a,inset 4px 0 0 #00000040}
.bk .cov img{width:100%;height:100%;object-fit:cover;display:block}
.bk .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0004 0,#fff1 4%,#0000 9%)}
.bk .gen{position:absolute;inset:0;padding:14px 10px 12px 14px;display:flex;flex-direction:column;background:linear-gradient(160deg,hsl(var(--h) 38% 32%),hsl(calc(var(--h) + 30) 42% 14%))}
.bk .gen b{font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif;color:#fff;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.bk .gen i{margin-top:auto;color:#ffd8a0;font-size:11px}
.bk .gen::before{content:"";position:absolute;inset:7px 7px 7px 10px;border:1px solid #ffffff30;border-radius:2px}
.bk .t{color:#efe3cf;font-size:13px;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .a{color:#9c8a72;font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .pb{height:3px;background:#ffffff1a;border-radius:3px;margin-top:6px;overflow:hidden}.bk .pb i{display:block;height:100%;background:#e0a96d}
.bk .ext{position:absolute;top:8px;right:8px;z-index:2;background:#000a;color:#fff;font-size:10px;padding:2px 6px;border-radius:5px}
.detail{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}
.detail.open{display:flex;animation:fade .2s}
.detail .box{width:min(640px,100%);background:#f3e7d3;color:#2a1d12;border-radius:18px;padding:22px;display:grid;grid-template-columns:160px 1fr;gap:22px;box-shadow:0 30px 80px #000}
.detail .cov{width:160px;height:240px}
.detail h2{font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Telugu",Georgia,serif;font-size:24px;line-height:1.2}
.detail .by{color:#7a6248;margin:6px 0 12px;font-style:italic}
.detail .facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.detail .facts span{font-size:12px;background:#2a1d1214;padding:4px 9px;border-radius:999px}
.detail .go{display:inline-flex;padding:12px 20px;border-radius:12px;background:#2a1d12;color:#f3e7d3;font-weight:700;border:0;cursor:pointer;text-decoration:none}
.detail .x{float:right;font-size:22px;color:#7a6248}
@media(max-width:600px){.detail .box{grid-template-columns:1fr;justify-items:center;text-align:center}.detail .facts{justify-content:center}}
.wv{position:fixed;inset:0;z-index:75;display:none;flex-direction:column;background:#f3e7d3}
.wv.open{display:flex;animation:fade .25s}
.wvbar{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:#2a1d12;color:#f3e7d3}
.wvbar b{flex:1;font-family:"Noto Serif","Noto Serif Telugu","Noto Serif Devanagari",Georgia,serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wvbar a{color:#e0a96d;font-size:13px;white-space:nowrap}
.wvbar .ib{color:#f3e7d3;border-color:#ffffff30}
.wv iframe{flex:1;width:100%;border:0;background:#fff}
/* reader: real paper */
.er{background-image:radial-gradient(#0000000a 1px,transparent 1.2px),linear-gradient(90deg,#0000000f,transparent 3%,transparent 97%,#0000000f);background-size:4px 4px,100% 100%}
.er[data-theme=night]{background-image:none}
.er-view{box-shadow:0 0 0 1px #00000010,0 18px 50px #0000001f;background:var(--bg);border-radius:4px;margin-top:6px;margin-bottom:6px}

// Book → sections of HTML (keeps each page layout light, even for long novels)
const HEAD = /^(chapter|book|part|act|canto|section|letter|prologue|epilogue|preface|introduction|अध्याय|भाग|అధ్యాయము|అధ్యాయం|భాగము)\b|^[ivxlc]+\.?$|^[0-9]{1,3}\.?$/i;
function textToBook(text) {
  const paras = text.replace(/\r/g, "").split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  const sections = [], toc = []; let cur = "", len = 0;
  const flush = () => { if (cur) { sections.push(cur); cur = ""; len = 0; } };
  for (const p of paras) {
    const isHead = p.length < 70 && (HEAD.test(p) || (p === p.toUpperCase() && /[A-Z]/.test(p) && p.length < 50));
    if (isHead) { if (len > 3500) flush(); toc.push({ t: p, s: sections.length }); cur += `<h2>${esc(p)}</h2>`; continue; }
    cur += `<p>${esc(p)}</p>`; len += p.length;
    if (len > 16000) flush();
  }
  flush();
  return { sections: sections.length ? sections : ["<p></p>"], toc };
}
async function openLib(id) {

    const text = await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text();
    const { sections, toc } = textToBook(text);
    sections[0] = `<h1>${esc(meta.t)}</h1><div class="by">${esc(meta.a || "")}</div><div class="orn">✦ ✦ ✦</div>` + sections[0];
    bk = { key: "lib-" + id, title: meta.t, lang: meta.l, sections, toc, orig: false };
    const rec = store.get("recent", []).filter(x => x !== id); rec.unshift(id); store.set("recent", rec.slice(0, 12));
    startReader();
  } catch { toast(L("offline")); }
}
function openBook(id) {
  const b = BOOKS.find(x => x.id === id); if (!b) return;
  const sections = b.ch.map((c, i) => `${i === 0 ? `<h1>${esc(b.t[lang])}</h1><div class="by">${esc(b.by[lang])}</div><div class="orn">✦ ✦ ✦</div>` : ""}<h2><small>${i + 1}</small>${esc(c.t[lang])}</h2>` + c.x[lang].split(/\n\n/).map(p => `<p>${esc(p)}</p>`).join(""));
  sections.push(`<div class="fin">— ${B("fin")} —</div>`);
  bk = { key: b.id + lang, id: b.id, title: b.t[lang], lang, sections, toc: b.ch.map((c, i) => ({ t: c.t[lang], s: i })), orig: true };
  startReader();
}
function startReader() {
  $("#toast").classList.remove("show");
  $("#er").classList.add("open"); document.body.style.overflow = "hidden";
  history.pushState({ b: 1 }, "");
  const p = store.get("bookpos", {})[bk.key] || { s: 0, f: 0 };
  sec = Math.min(p.s || 0, bk.sections.length - 1); layout(p.f || 0);
}
function closeBook() { $("#er").classList.remove("open", "calm"); document.body.style.overflow = ""; bk = null; $("#erPop").classList.remove("open"); $("#erTocBox").classList.remove("open"); render(); }
function layout(frac, toEnd) {
  const v = $("#erView"), fl = $("#erFlow"), gap = 48;
  $("#er").dataset.theme = er.theme === "paper" ? "" : er.theme;
  fl.style.setProperty("--fs", er.fs + "px"); fl.style.setProperty("--ff", FONTS[er.font][bk.lang]); $("#er").style.setProperty("--ff", FONTS[er.font][bk.lang]);
  const W = v.clientWidth - 48, H = v.clientHeight - 16;
  Object.assign(fl.style, { left: "24px", top: "8px", height: H + "px", width: W + "px", columnWidth: W + "px", columnGap: gap + "px" });
  fl.className = "er-flow lang-" + bk.lang; fl.innerHTML = bk.sections[sec];
  $("#erT").textContent = bk.title;
  $("#erRange").max = bk.sections.length - 1; $("#erRange").value = sec;
  requestAnimationFrame(() => { pages = Math.max(1, Math.round((fl.scrollWidth + gap) / (W + gap))); goPage(toEnd ? pages - 1 : Math.round((frac || 0) * (pages - 1)), true); });
}
function goPage(p, instant) {
  if (p < 0 && sec > 0) { sec--; return layout(0, true); }
  if (p >= pages && sec < bk.sections.length - 1) { sec++; return layout(0); }
  page = Math.max(0, Math.min(pages - 1, p));
  const fl = $("#erFlow"), W = fl.clientWidth + 48;
  fl.style.transition = instant ? "none" : ""; fl.style.transform = `translateX(${-page * W}px)`;
  if (!instant && goPage.last !== undefined) { const c = $("#erCurl"); c.className = "curl"; void c.offsetWidth; c.className = "curl " + (page >= goPage.last ? "fwd" : "back"); }
  goPage.last = page; $("#erNo").textContent = `— ${page + 1} —`;
  const f = pages > 1 ? page / (pages - 1) : 0, total = (sec + f) / Math.max(1, bk.sections.length - (bk.sections.length > 1 ? 1 : 0));
  const ch = [...bk.toc].reverse().find(c => c.s <= sec);
  $("#erCh").textContent = ch ? ch.t : bk.title;
  $("#erPg").textContent = `${Math.min(100, Math.round(total * 100))}%`;
  const pos = store.get("bookpos", {}); pos[bk.key] = { s: sec, f, p: Math.min(1, total) }; store.set("bookpos", pos);
}
$("#erL").onclick = () => goPage(page - 1);
$("#erR").onclick = () => goPage(page + 1);
$("#erC").onclick = () => { $("#er").classList.toggle("calm"); $("#erPop").classList.remove("open"); };
$("#erRange").oninput = e => { sec = +e.target.value; layout(0); };
$("#erClose").onclick = () => history.back();
let ex = 0; $("#erView").addEventListener("touchstart", e => ex = e.touches[0].clientX, { passive: true });
$("#erView").addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - ex; if (Math.abs(d) > 40) goPage(page + (d < 0 ? 1 : -1)); });
document.addEventListener("keydown", e => { if (!bk) return; if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goPage(page + 1); } if (e.key === "ArrowLeft") goPage(page - 1); if (e.key === "Escape") history.back(); });
window.addEventListener("resize", () => { if (bk) layout(page / Math.max(1, pages - 1)); });
function drawPop() {
  const th = [["paper", "#f6efe1"], ["white", "#ffffff"], ["sepia", "#f4e6c8"], ["night", "#121014"]];
  $("#erPop").innerHTML = `<div style="font-size:12px;color:var(--mut);margin-bottom:6px">${B("size")}</div>
  <div class="r"><button data-fs="-1" style="font-size:14px">A−</button><button data-fs="1" style="font-size:20px">A+</button></div>
  <div style="font-size:12px;color:var(--mut);margin-bottom:6px">${B("theme")}</div>
  <div class="r">${th.map(([k, c]) => `<button class="sw ${er.theme === k ? "on" : ""}" data-th="${k}" style="background:${c}"></button>`).join("")}</div>
  <div style="font-size:12px;color:var(--mut);margin-bottom:6px">${B("font")}</div>
  <div class="r" ${bk.orig ? "" : 'style="margin:0"'}><button data-ff="serif" class="${er.font === "serif" ? "on" : ""}" style="font-family:Georgia,serif">Serif</button><button data-ff="sans" class="${er.font === "sans" ? "on" : ""}">Sans</button></div>
  ${bk.orig ? `<div class="r" style="margin:0">${["en", "hi", "te"].map(l => `<button data-bl="${l}" class="${lang === l ? "on" : ""} lang-${l}">${{ en: "EN", hi: "हिं", te: "తె" }[l]}</button>`).join("")}</div>` : ""}`;
}
$("#erAa").onclick = () => { drawPop(); $("#erPop").classList.toggle("open"); };
$("#erPop").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const frac = page / Math.max(1, pages - 1);
  if (b.dataset.fs) er.fs = Math.max(14, Math.min(30, er.fs + +b.dataset.fs * 2));
  if (b.dataset.th) er.theme = b.dataset.th;
  if (b.dataset.ff) er.font = b.dataset.ff;
  store.set("er", er);
  if (b.dataset.bl) { lang = b.dataset.bl; store.set("lang", lang); document.querySelectorAll("#langs button").forEach(x => x.classList.toggle("on", x.dataset.l === lang)); const s = sec; openBookSilently(bk.id, s); drawPop(); return; }
  drawPop(); layout(frac);
};
function openBookSilently(id, s) { const keep = sec; openBook.call(null, id); history.back(); sec = Math.min(s ?? keep, bk.sections.length - 1); layout(0); }
$("#erToc").onclick = () => {
  $("#erTocBox").innerHTML = `<div style="display:flex;align-items:center;gap:10px"><button class="ib" id="tocX" aria-label="Close" style="border-bottom:0;padding:0;justify-content:center"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h3 style="margin:0">${B("contents")}</h3></div><div style="height:12px"></div>` +
    (bk.toc.length ? bk.toc : bk.sections.map((_, i) => ({ t: `${B("page")} ${i + 1}`, s: i }))).map((c, i) => `<button data-go="${c.s}" class="${c.s === sec ? "cur" : ""}"><span>${i + 1}</span>${esc(c.t)}</button>`).join("");
  $("#erTocBox").classList.add("open");
};
$("#erTocBox").onclick = e => {
  if (e.target.closest("#tocX")) { $("#erTocBox").classList.remove("open"); return; }
  const g = e.target.closest("[data-go]"); if (!g) return;
  sec = +g.dataset.go; layout(0); $("#erTocBox").classList.remove("open");
  const h = [...$("#erFlow").querySelectorAll("h2")].find(x => x.textContent.trim() === g.textContent.replace(/^\d+/, "").trim());
  if (h) requestAnimationFrame(() => goPage(Math.floor(h.offsetLeft / ($("#erFlow").clientWidth + 48))));
};

setLang(lang);
if (Date.now() - store.get("lastCheck", 0) > 6 * 3600e3) setTimeout(() => checkUpdates(false), 2500);
if ("serviceWorker" in navigator && PLATFORM === "web") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
